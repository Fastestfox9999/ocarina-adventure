name: Publish playable game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python prepare.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Package Mac download
        run: |
          mkdir -p package/Ocarina
          cp -R site package/Ocarina/
          cp README.md patch_engine.py package/Ocarina/
          sed '/^python3 .*prepare.py/d' 'Play Ocarina.command' > 'package/Ocarina/Play Ocarina.command'
          chmod +x 'package/Ocarina/Play Ocarina.command'
          cd package
          zip -qr ../Ocarina-Adventure-Mac.zip Ocarina
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view adventure-skip8 || gh release create adventure-skip8 --verify-tag --title 'Ocarina Adventure — play online or download for Mac' --notes-file RELEASE.md
          gh release upload adventure-skip8 Ocarina-Adventure-Mac.zip --clobber
